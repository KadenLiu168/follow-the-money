# ---------------------------------------------------------------------------
# Six-group v1 mandatory coverage matrix (design section 2).
# ---------------------------------------------------------------------------
coverage:
  - { group: us_official_macro_policy,       members: [federal_reserve, bls],         minimum: 2, capability: release_and_calendar }
  - { group: us_company_filings,             members: [sec_edgar],                    minimum: 1, capability: watched_company_filings }
  - { group: china_official_macro_policy,    members: [pboc, nbs],                    minimum: 2, capability: official_evidence_and_calendar }
  - { group: china_exchange_evidence,        members: [sse, szse],                    minimum: 2, capability: notice_and_market }
  - { group: china_hk_cross_asset_market,    members: [yahoo_market],                 minimum: 1, capability: market_data_all_13_roles }
  - { group: future_calendar,                members: [federal_reserve, bls, nbs],    minimum: 3, capability: future_release_calendar }
