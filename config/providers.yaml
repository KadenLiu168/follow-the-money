# Provider registry and the six-group v1 mandatory coverage matrix.
#
# Contract manifests live under providers/<id>.yaml; this file is the closed
# registry that enables/verifies adapters and declares the coverage matrix.
# A provider may be enabled only after its contract is verified (task 3.x
# owns that verification); shipped defaults here are explicitly NOT enabled
# until the manifest/registry tests pass (task 3.17/3.18).

providers:
  - id: federal_reserve
    name: Federal Reserve
    enabled: true
    verified: true
    default_enabled: true
    group: us_official_macro_policy
    source_family_id: federal_reserve
    tier: "Tier 1"
    user_agent: "follow-the-money/0.1 (+https://github.com/KadenLiu168/follow-the-money)"
    fetch_hosts:
      - { host: federalreserve.gov }
      - { host: www.federalreserve.gov }
    redirect_hosts:
      - { host: federalreserve.gov }
    source_link_hosts:
      - { host: federalreserve.gov, allow_subdomains: true }
    rate_policy:
      scope_id: us_gov
      capacity: 20
      refill_period_seconds: 60
      minimum_interval_seconds: 1
    allowed_charset: utf-8
    pagination: none
    empty_valid_for_window: true
    verification_date: "2026-08-11"
    contract_url: "https://www.federalreserve.gov/feeds/press_all.xml"

  - id: bls
