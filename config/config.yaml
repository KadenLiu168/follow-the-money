# Follow the Money — shipped Feed-only configuration.
# Unknown, removed, or missing fields fail closed. No credential is required.

schema_version: 1
name: follow-the-money
timezone: Asia/Shanghai
output_root: feeds
runtime_state_root: .feed-state
runs_root: runs

feed:
  bootstrap_lookback_hours: 72
  gap_threshold_hours: 72
  pre_commit_deadline_seconds: 300
  commit_reserve_seconds: 15
  global_concurrency: 8
  per_host_concurrency: 2
  http_attempt_timeout_seconds: 20
  max_attempts: 3
  max_decompressed_response_bytes: 10485760
  max_items_per_provider: 2000
  max_title_code_points: 300
  max_snippet_code_points: 1000
  max_url_characters: 2048
  max_serialized_feed_bytes: 52428800
  lock_timeout_seconds: 60

rate_registry:
  version: "1"
  crash_cooldown_hours: 24
  schema_file: rate-registry.json

source_families:
  - { id: federal_reserve, name: "Federal Reserve", tier: "Tier 1" }
  - { id: bls, name: "U.S. Bureau of Labor Statistics", tier: "Tier 1" }
  - { id: sec, name: "SEC EDGAR", tier: "Tier 1" }
  - { id: cftc, name: "CFTC", tier: "Tier 1" }
  - { id: pboc, name: "中国人民银行", tier: "Tier 1" }
  - { id: nbs, name: "国家统计局", tier: "Tier 1" }
  - { id: sse, name: "上海证券交易所", tier: "Tier 1" }
  - { id: szse, name: "深圳证券交易所", tier: "Tier 1" }

watched_companies:
  - { cik: "0001067983", name: "Berkshire Hathaway", tickers: [BRK.A, BRK.B] }
  - { cik: "0001336528", name: "Pershing Square Capital", tickers: [] }
  - { cik: "0001539579", name: "Scion Asset Management", tickers: [] }
  - { cik: "0001535213", name: "Baupost Group", tickers: [] }
  - { cik: "0000926522", name: "Oaktree Capital Management", tickers: [] }
  - { cik: "0001499575", name: "ARK Investment Management", tickers: [] }
  - { cik: "0001160822", name: "Tiger Global Management", tickers: [] }
