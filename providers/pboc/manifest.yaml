# PBOC (中国人民银行) — provider contract manifest
# Contract status: verified on 2026-08-11 against the public HTML index
# contract and the checked-in fixture. Mandatory china_official_macro_policy.

contract_version: 1
provider_id: pboc
name: 中国人民银行
verification:
  verified: true
  verification_date: "2026-08-11"
  contract_url: "https://www.pbc.gov.cn/goutongjiaoliu/113456/113469/index.html"
  usage_note: >
    Official policy announcements, rates, and monetary-policy news from
    pbc.gov.cn. Public data, no authentication; HTML index and source-link
    rules are verified.

authentication: none
user_agent: "follow-the-money/0.1 (+https://github.com/KadenLiu168/follow-the-money)"

charset:
  allowed: [utf-8]
  bom_allowed: false
  content_type_header: null

fetch_hosts:
  - { host: pbc.gov.cn }
  - { host: www.pbc.gov.cn }
redirect_hosts:
  - { host: pbc.gov.cn }

source_link_hosts:
  - host: pbc.gov.cn
    allow_subdomains: true
    allowed_ports: [443]
    allowed_query_params: []
    drop_query_params: []

rate_policy:
  scope_id: china_gov
  capacity: 20
  refill_period_seconds: 60
  minimum_interval_seconds: 1

time:
  knowledge_time: published_at
  payload_types: [policy, macro_release]

identity:
  stable_record_id: announcement_id_or_url

units:
  percent: percent
  bps: bps

freshness:
  policy: source_published_within_window

empty_valid_for_window: true
pagination: none
default_enabled: true

fixture_provenance:
  source: "Recorded from live responses on 2026-08-11; fixture-backed adapter contract."
  files:
    - fixtures/announcements.json
