# BLS (U.S. Bureau of Labor Statistics) — provider contract manifest
# Contract status: verified on 2026-08-11 against the public RSS contract and
# the checked-in fixture.

contract_version: 1
provider_id: bls
name: U.S. Bureau of Labor Statistics
verification:
  verified: true
  verification_date: "2026-08-11"
  contract_url: "https://www.bls.gov/feed/news.release.xml"
  usage_note: >
    CPI/PCE-related press releases and economic news releases. Public data,
    no authentication; RSS response and source-link rules are verified.

authentication: none
user_agent: "follow-the-money/0.1 (+https://github.com/KadenLiu168/follow-the-money)"

charset:
  allowed: [utf-8]
  bom_allowed: false
  content_type_header: null

fetch_hosts:
  - { host: bls.gov }
  - { host: www.bls.gov }
redirect_hosts:
  - { host: bls.gov }

source_link_hosts:
  - host: bls.gov
    allow_subdomains: true
    allowed_ports: [443]
    allowed_query_params: []
    drop_query_params: []

rate_policy:
  scope_id: us_gov
  capacity: 20
  refill_period_seconds: 60
  minimum_interval_seconds: 1

time:
  knowledge_time: released_at
  payload_types: [macro_release, calendar]
  calendar_capability: future_release_calendar

identity:
  stable_record_id: series_id_plus_release_date

units:
  percent: percent
  index: index

freshness:
  policy: source_released_within_window

empty_valid_for_window: true
pagination: none
default_enabled: true

fixture_provenance:
  source: "Recorded from live responses on 2026-08-11; fixture-backed adapter contract."
  files:
    - fixtures/news.release.xml
