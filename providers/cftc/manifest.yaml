# Shipped production activation and minimum-one coverage are owned by
# config/providers.yaml.

contract_version: 1
provider_id: cftc
name: CFTC COT
source_family_id: cftc
tier: "Tier 1"
verification:
  verified: true
  verification_date: "2026-08-11"
  contract_url: "https://publicreporting.cftc.gov/Commitments-of-Traders/Legacy-Futures-Only/6dca-aqww"
  usage_note: >
    Commitments of Traders positioning reports. Public data, no
    authentication; the weekly positioning contract is verified.

authentication: none
protocol: https
user_agent: "follow-the-money/0.1 (+https://github.com/KadenLiu168/follow-the-money)"

charset:
  allowed: [utf-8]
