# CFTC COT — provider contract manifest
# Contract status: verified on 2026-08-11 against the official COT PRE API.
# Optional coverage: positioning output is conditional and cannot satisfy a
# mandatory matrix row alone.

contract_version: 1
provider_id: cftc
name: CFTC COT
verification:
  verified: true
  verification_date: "2026-08-11"
  contract_url: "https://publicreporting.cftc.gov/Commitments-of-Traders/Legacy-Futures-Only/6dca-aqww"
  usage_note: >
    Commitments of Traders reports and release calendar. Public data, no
