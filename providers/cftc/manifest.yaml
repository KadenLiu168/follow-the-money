  - { host: publicreporting.cftc.gov, allow_subdomains: false, allowed_ports: [443] }
redirect_hosts:
  - { host: cftc.gov, allow_subdomains: false, allowed_ports: [443] }
  - { host: publicreporting.cftc.gov, allow_subdomains: false, allowed_ports: [443] }

source_link_hosts:
  - host: cftc.gov
    allow_subdomains: true
    allowed_ports: [443]
    allowed_query_params: []
    query_value_grammar: any
    drop_query_params: []

rate_policy:
  scope_id: us_gov
  capacity: 20
  refill_period_seconds: 60
  minimum_interval_seconds: 1

response_limit_bytes: 10485760
attempt_timeout_seconds: 20

time:
  knowledge_time: report_publication_instant
  payload_types: [positioning]

identity:
  stable_record_id: report_date_plus_instrument

units:
  percent: percent
  contracts: contracts

freshness:
