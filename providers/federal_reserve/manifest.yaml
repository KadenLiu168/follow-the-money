# Federal Reserve — provider contract manifest
# Contract status: verified on 2026-08-11 against the public RSS contract and
# the checked-in fixture. The adapter remains evidence-only and bounded.

contract_version: 1
provider_id: federal_reserve
name: Federal Reserve
source_family_id: federal_reserve
tier: "Tier 1"
verification:
  verified: true
  verification_date: "2026-08-11"
  contract_url: "https://www.federalreserve.gov/feeds/press_all.xml"
  usage_note: >
    Official policy statements, press releases, FOMC calendar. Public data,
    no authentication; RSS response and source-link rules are verified.

authentication: none
protocol: https
user_agent: "follow-the-money/0.1 (+https://github.com/KadenLiu168/follow-the-money)"

charset:
  allowed: [utf-8]
  bom_allowed: false
  content_type_header: null

fetch_hosts:
  - { host: federalreserve.gov, allow_subdomains: false, allowed_ports: [443] }
  - { host: www.federalreserve.gov, allow_subdomains: false, allowed_ports: [443] }
redirect_hosts:
  - { host: federalreserve.gov, allow_subdomains: false, allowed_ports: [443] }

source_link_hosts:
  - host: federalreserve.gov
    allow_subdomains: true
    allowed_ports: [443]
    allowed_query_params: []
    query_value_grammar: any
    drop_query_params: []
  - host: www.federalreserve.gov
    allow_subdomains: false
    allowed_ports: [443]
    allowed_query_params: []
    query_value_grammar: any
    drop_query_params: []

rate_policy:
  scope_id: us_gov
  capacity: 20
  refill_period_seconds: 60
  minimum_interval_seconds: 1

response_limit_bytes: 10485760
attempt_timeout_seconds: 20

time:
  knowledge_time: published_at
  payload_types: [policy, calendar, macro_release]
  calendar_capability: future_release_calendar

identity:
  stable_record_id: release_id_or_slug

units:
  policy_rate: percent
  index: index

freshness:
  cadence: scheduled
  reference_time: source_updated_at
  valid_for_seconds: 604800

empty_valid_for_window: true
pagination: none
default_enabled: true

fixture_provenance:
  source: "Recorded from live responses on 2026-08-11; fixture-backed adapter contract."
  files:
    - fixtures/press_all.xml
