# SEC EDGAR — Provider contract manifest
# SEC v4 source contract was verified on 2026-08-11 against the public
# submissions JSON contract. Form 4 and Schedule 13D/G support is covered by
# synthetic, production-shaped fixtures; see fixture_provenance below.

contract_version: 4
provider_id: sec_edgar
name: SEC EDGAR
source_family_id: sec
tier: "Tier 1"
verification:
  verified: true
  verification_date: "2026-08-11"
  contract_url: >-
    https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&type=13F
  usage_note: >
    Exact 13F-HR company filings for watched companies, bounded Form 4/4-A
    filings for configured issuers, and bounded structured Schedule 13D/G
    filings for configured reporting filers. Public data; EDGAR requires a
    descriptive user agent with a contact identifier. The submissions endpoint,
    ownership XML schemas X0609/X0202, and archive source-link rules are
    verified.

authentication: none
protocol: https
user_agent: "follow-the-money/0.1 kaden@example.com"

charset:
  allowed: [utf-8]
  bom_allowed: false
  content_type_header: null

fetch_hosts:
  - {host: www.sec.gov, allow_subdomains: false, allowed_ports: [443]}
  - {host: data.sec.gov, allow_subdomains: false, allowed_ports: [443]}
redirect_hosts:
  - {host: www.sec.gov, allow_subdomains: false, allowed_ports: [443]}
  - {host: data.sec.gov, allow_subdomains: false, allowed_ports: [443]}

source_link_hosts:
  - host: sec.gov
    allow_subdomains: true
    allowed_ports: [443]
    allowed_query_params: []
    query_value_grammar: any
    drop_query_params: []
  - host: www.sec.gov
    allow_subdomains: false
    allowed_ports: [443]
    allowed_query_params: []
    query_value_grammar: any
    drop_query_params: []

rate_policy:
  scope_id: sec_edgar
  capacity: 10
  refill_period_seconds: 60
  minimum_interval_seconds: 5

response_limit_bytes: 10485760
attempt_timeout_seconds: 20

time:
  knowledge_time: acceptance_publication_instant
  payload_types: [filing]

identity:
  stable_record_id: accession_number

units:
  13f_value_before_2023_01_03: usd_thousands
  13f_value_from_2023_01_03: usd
  reported_value_usd_thousands: usd_thousands

freshness:
  cadence: event_driven
  reference_time: checked_at

empty_valid_for_window: true
pagination: page_number
default_enabled: true

form4:
  max_filings_per_window: 20
  ownership_xml_schema_versions: [X0609]

beneficial_ownership:
  max_filings_per_window: 7
  max_history_files: 1
  max_historical_candidate_documents: 64
  max_reporting_positions_per_filing: 32
  structured_formats: [edgarSubmission]
  schema_versions: [X0202]
  locator_prefixes: [xslSCHEDULE_13G_X01, xslSCHEDULE_13G_X02]

fixture_provenance:
  source: >-
    SEC 13F and Form 4 source rules are verified in
    references/provider-source-verification.md; checked-in ownership documents
    are explicitly synthetic production-shaped fixtures with no claims of live
    filing provenance.
  files:
    - fixtures/browse-13f.json
    - fixtures/semantic-submissions.json
    - fixtures/semantic-current.xml
    - fixtures/semantic-previous.xml
    - fixtures/form4/submissions.json
    - fixtures/form4/mixed.xml
    - fixtures/form4/amendment.xml
    - fixtures/beneficial_ownership/submissions.json
    - fixtures/beneficial_ownership/13d.xml
    - fixtures/beneficial_ownership/13g-amendment.xml
