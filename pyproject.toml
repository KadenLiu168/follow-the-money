[project]
name = "follow-the-money"
version = "0.1.0"
description = "Deterministic daily financial intelligence pipeline: evidence-only Feed, canonical events, constrained LLM analysis, Chinese Morning Money Brief."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "httpx>=0.27,<1",
    "PyYAML>=6.0,<7",
    "jsonschema>=4.22,<5",
    "openai>=1.40,<3",
    "feedparser>=6.0,<7",
    "exchange-calendars>=4.8,<5",
]

[project.optional-dependencies]
akshare = [
    "akshare>=1.14,<2",
]

[dependency-groups]
dev = [
    "hatchling>=1.27,<2",
    "mypy>=1.17,<2",
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<7",
    "ruff>=0.6,<1",
]

[project.scripts]
follow-the-money = "follow_the_money.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/follow_the_money"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers -q"
pythonpath = ["src", "."]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
disable_error_code = ["import-untyped"]
