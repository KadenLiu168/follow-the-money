[project]
name = "follow-the-money"
version = "0.1.0"
description = "Credential-free evidence Feed for AI Agents, plus private on-demand deterministic Audit and Event Structuring; other research libraries remain retained without production orchestration."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "httpx>=0.27,<1",
    "PyYAML>=6.0,<7",
    "jsonschema>=4.22,<5",
    "feedparser>=6.0,<7",
    "exchange-calendars>=4.8,<5",
]

[dependency-groups]
dev = [
    "hatchling>=1.27,<2",
    "mypy>=1.17,<2",
    "pytest>=8.0,<9",
    "ruff>=0.6,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/follow_the_money"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers -q"
pythonpath = ["src", "."]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
disable_error_code = ["import-untyped"]
