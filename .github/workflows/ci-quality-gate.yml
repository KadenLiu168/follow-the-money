name: CI Quality Gate

on:
  push:
  pull_request:

# Hosted credential-free CI: clean install, offline-only tests, no secrets.
permissions:
  contents: read

jobs:
  classify_generated_state:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      generated_only: ${{ steps.classify.outputs.generated_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.21"
      - name: Validate closed generated-state path set
        id: classify
        run: |
          set -euo pipefail
          generated_only=$(uv run --frozen python scripts/validate_generated_state.py \
            --repo . --head "${GITHUB_SHA}" --base "${{ github.event.before }}")
          echo "generated_only=$generated_only" >> "$GITHUB_OUTPUT"

  test:
    needs: classify_generated_state
    if: ${{ always() && (github.event_name != 'push' || needs.classify_generated_state.outputs.generated_only != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate GitHub Actions semantics
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}" \
            | tar -xz -C "$RUNNER_TEMP"
          actionlint="$RUNNER_TEMP/actionlint"
          "$actionlint" -config-file .github/actionlint.yaml
          if "$actionlint" -config-file .github/actionlint.yaml \
            tests/fixtures/workflows/invalid-workflow-level-runner-context.yml; then
            echo "invalid workflow fixture unexpectedly passed" >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.21"
      - name: Clean install
        run: uv sync --frozen --all-groups
      - name: Credential-free test suite
        run: uv run pytest -q
        env:
          # Ensure no implicit credential or machine-global config is read.
          CI: "true"
      - name: Validate workflows and entry points
        run: |
          uv run python -c "import follow_the_money; print(follow_the_money.__version__)"
          uv run python -m follow_the_money.feed.cli --help >/dev/null
