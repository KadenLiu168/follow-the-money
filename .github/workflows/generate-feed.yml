name: generate-feed

on:
  schedule:
    # 00:20 UTC == 08:20 Asia/Shanghai.
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: follow-the-money-feed
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.21"

      - name: Install
        run: uv sync --frozen --all-groups

      - name: Static deployment preflight and durable arming
        id: prepare
        run: |
          set -euo pipefail
          uv run python -m follow_the_money.feed.deployment prepare \
            --repo . \
            --product-root feeds \
            --runtime-state-root .feed-state \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output "$GITHUB_OUTPUT"

      - name: Publish durable pre-network state
        if: ${{ steps.prepare.outputs.mode == 'bootstrap' || steps.prepare.outputs.mode == 'migration' || steps.prepare.outputs.mode == 'armed' }}
        run: |
          set -euo pipefail
          # The helper performs exactly: git push origin HEAD:main
          uv run python -m follow_the_money.feed.deployment publish --phase pre \
            --repo . \
            --product-root feeds \
            --runtime-state-root .feed-state \
            --mode "${{ steps.prepare.outputs.mode }}" \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Collect Feed after durable arming
        id: feed
        if: ${{ steps.prepare.outputs.mode == 'armed' }}
        run: |
          set -euo pipefail
          uv run python -m follow_the_money.feed.deployment collect \
            --product-root feeds \
            --runtime-state-root .feed-state \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --status-file feed-status.json \
            --exit-file .feed-exit-code

      - name: Finalize exact deployment state
        if: ${{ always() && steps.prepare.outputs.mode == 'armed' }}
        run: |
          set -euo pipefail
          FEED_SUCCEEDED=false
          if [ "${{ steps.feed.outcome }}" = "success" ]; then
            FEED_SUCCEEDED=true
          fi
          uv run python -m follow_the_money.feed.deployment finalize \
            --repo . \
            --product-root feeds \
            --runtime-state-root .feed-state \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --status-file feed-status.json \
            --feed-succeeded "$FEED_SUCCEEDED"

      - name: Present Feed failure diagnostics
        if: ${{ always() && steps.feed.outcome == 'failure' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          uv run python -m follow_the_money.feed.deployment diagnostics \
            --status-file feed-status.json \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Preserve original Feed failure
        if: ${{ always() && steps.feed.outcome == 'failure' }}
        run: |
          set -euo pipefail
          exit_code=1
          if [ -s .feed-exit-code ]; then
            exit_code=$(cat .feed-exit-code)
          fi
          exit "$exit_code"
